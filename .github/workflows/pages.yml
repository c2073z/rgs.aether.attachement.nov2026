# Builds the Sortle website (SortleWeb/) and publishes it to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
#
# One-time setup by the repo owner: Settings -> Pages -> Source: "GitHub Actions".

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the students' code first
        run: dotnet run -- check

      - name: Publish the website
        run: dotnet publish SortleWeb/SortleWeb.csproj -c Release -o out

      - name: Point the site at /<repo-name>/ and add Pages extras
        run: |
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
